services:
  db:
    shm_size: 256m
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=50
      - -c
      - random_page_cost=1.1
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536m

  app:
    ports: !override []
    expose:
      - "8080"
    environment:
      TRUST_PROXY: "true"
      GOMEMLIMIT: 900MiB
      GOMAXPROCS: "1"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024m

  caddy:
    image: caddy:2-alpine
    environment:
      ALVO_DOMAIN: ${ALVO_DOMAIN:?set ALVO_DOMAIN in .env}
      ALVO_TLS_EMAIL: ${ALVO_TLS_EMAIL:?set ALVO_TLS_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddydata:
  caddyconfig:
